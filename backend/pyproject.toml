[project]
name = "ocw-canvas-backend"
version = "0.1.0"
description = "OCW Canvas backend — single-user Canvas-like LMS for self-studying open courseware"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "email-validator>=2.0",
    "anthropic>=0.101.0",
    "claude-agent-sdk>=0.1.81",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `= Depends(...)` / `= Cookie(...)` in defaults is the intended idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
