# Render blueprint: a Docker Web Service (the API).
# The hourly /api/cron/tick is fired by the GitHub Actions workflow `.github/workflows/cron-tick.yml`
# rather than a Render Cron Job — Render's Cron service isn't on the free plan, and the GH Actions
# scheduler is free. If you ever upgrade to a paid Render plan and want a colocated cron, add a
# second service block (type: cron, plan: starter, schedule: "0 * * * *", dockerCommand: >- curl …).
# Secrets are NOT committed — `sync: false` means "set this in the Render dashboard".
services:
  - type: web
    name: ocw-canvas-api
    runtime: docker
    repo: https://github.com/dafu-zhu/ocw-canvas
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Use ONE of these two:
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_SOLUTION_GENERATION_ENABLED
        value: "true"
      - key: AI_MODEL
        value: claude-sonnet-4-6
      - key: RESEND_API_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_EMAIL_FROM
        value: onboarding@resend.dev
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
