name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Build the Vite SPA and publish frontend/dist/ to the gh-pages branch.
# Set a repository **variable** VITE_API_BASE_URL (Settings → Secrets and variables → Actions →
# Variables) to your deployed backend URL, e.g. https://ocw-canvas-api.onrender.com — with no
# trailing slash. If unset, the build still succeeds but the SPA will call a relative /api (404s
# until you set it).
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
